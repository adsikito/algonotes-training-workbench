name: CI

# Gate for the v2 rebuild: typecheck, lint and the assertion suite must pass
# before anything lands on `main`.
#
# Deliberately NOT running `pnpm build`: the build path needs Cloudflare
# credentials, so a build job here would either fail for everyone without
# secrets or silently pass without proving anything. `typecheck` already
# covers the type-level surface of the same code.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck / lint / test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth: `engines.node` in package.json. GitHub-hosted
      # runners ship a Node binary, which we use only to read that field.
      # engines declares a floor (>=22.13.0), so CI resolves the major line
      # (`22.x`) to get the newest patch release of that line.
      - name: Read Node major from package.json engines
        id: engines
        run: |
          engines_node=$(node -p 'require("./package.json").engines.node')
          major=$(node -p 'require("./package.json").engines.node.replace(/[^0-9.]/g, "").split(".")[0]')
          echo "engines.node = $engines_node"
          echo "resolved CI node-version = $major.x"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      # version matches `packageManager` in package.json (pnpm@11.25.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.engines.outputs.major }}.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
